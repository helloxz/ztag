# Release: 推送 v* tag 时编译 Linux amd64/arm64 二进制（UPX 压缩）并发布 GitHub Release，
#          随后构建 linux/amd64 Docker 镜像推送到 GHCR。
# 手动补推镜像：Actions → Release → Run workflow，填入已存在的 tag（如 v0.2.3），只跑 docker job。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 release tag（形如 v0.2.3），仅重建/补推镜像"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.goarch }}
    # workflow_dispatch 只补推镜像，不重新编译/发版
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install tooling (upx)
        run: |
          sudo apt-get update
          sudo apt-get install -y upx
          upx --version

      - name: Resolve version from version.go
        id: version
        run: |
          # 从 internal/version/version.go 读取 Version 常量，失败则回退到 tag 名
          VER=$(grep -oE '"v[0-9]+\.[0-9]+\.[0-9][^"]*"' internal/version/version.go | tr -d '"' | head -n1 || true)
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME}"
            echo "version.go 解析失败，回退到 tag: $VER"
          fi
          # 容错：确保以 v 开头
          if [ -z "$VER" ]; then
            echo "无法解析版本号" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          echo "Building for linux/${{ matrix.goarch }} version=${{ steps.version.outputs.version }}"
          go build -trimpath -ldflags="-s -w" -o ztag ./cmd/server
          ls -lh ztag
          file ztag
          # 冒烟：验证 --version 可执行（仅本机架构可运行，交叉时跳过执行）
          if [ "${{ matrix.goarch }}" = "amd64" ] || [ "$(uname -m)" = "aarch64" ]; then
            ./ztag -version || ./ztag --version || true
          fi

      - name: Compress with UPX (best)
        run: |
          # upx --best --lzma 为最佳压缩比；失败不阻断发布（保留原二进制）
          if upx --best --lzma ztag; then
            echo "UPX compressed"
          else
            echo "UPX failed, keep original binary"
          fi
          ls -lh ztag

      - name: Package tar.gz
        run: |
          VER="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.goarch }}"
          PKG="ztag-${VER}-linux-${ARCH}.tar.gz"
          tar -czf "$PKG" ztag
          ls -lh "$PKG"
          sha256sum "$PKG" | tee "$PKG.sha256"
          echo "pkg=$PKG" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ztag-${{ steps.version.outputs.version }}-linux-${{ matrix.goarch }}
          path: |
            ztag-*.tar.gz
            ztag-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ztag-*
          merge-multiple: true
          path: dist/

      - name: Display artifacts
        run: |
          ls -lh dist/
          sha256sum dist/* || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # GHCR 镜像：等待 release 资产就绪后构建（Dockerfile 会下载该 tag 的二进制）
  # 仅 linux/amd64；镜像 tag 与 git tag 对齐：v0.2.3 / 0.2.3 / 0.2 / latest
  # ============================================================
  docker:
    name: docker-ghcr
    needs: [build, release]
    # 推 tag 时要求 release 成功；workflow_dispatch 时 build/release 被跳过，仅跑本 job
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 默认分支或指定 tag：保证 Dockerfile / scripts 与被构建的版本一致
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VER="${INPUT_TAG}"
          if [ -n "$VER" ]; then
            echo "using workflow_dispatch input: $VER"
          else
            # 从 internal/version/version.go 读取 Version 常量，失败则回退到 tag 名
            VER=$(grep -oE '"v[0-9]+\.[0-9]+\.[0-9][^"]*"' internal/version/version.go | tr -d '"' | head -n1 || true)
          fi
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME}"
            echo "version.go 解析失败，回退到 tag: $VER"
          fi
          case "$VER" in
            v*) ;;
            *) echo "invalid version (must start with v): $VER" >&2; exit 1 ;;
          esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Verify release assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          # 快速失败：镜像构建阶段会下载该 tag 的 release 资产
          if ! gh release view "$VER" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $VER not found in $REPO" >&2
            exit 1
          fi
          ASSETS="$(gh release view "$VER" --repo "$REPO" --json assets -q '.assets[].name')"
          if ! printf '%s\n' "$ASSETS" | grep -qx "ztag-${VER}-linux-amd64.tar.gz"; then
            echo "asset ztag-${VER}-linux-amd64.tar.gz not found in release $VER:" >&2
            printf '%s\n' "$ASSETS" >&2
            exit 1
          fi
          echo "release assets OK"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 锁定版本，禁止 Dockerfile 回退到 latest 解析（避免版本漂移）
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=ztag-docker
          cache-to: type=gha,mode=max,scope=ztag-docker
          provenance: false

