# Release: 推送 v* tag 时创建 GitHub Release（仅变更说明），
#          并构建 linux/amd64 Docker 镜像推送到 GHCR。
# 手动补推镜像：Actions → Release → Run workflow，填入已存在的 tag，只跑 docker job。
#
# 说明：镜像在 Dockerfile 内从源码编译（libvips 图片管线，cgo），
# 不再分发 tar.gz 二进制——二进制为动态链接，脱离容器需自行安装 libvips。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 release tag（形如 v0.2.3），仅重建/补推镜像"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release
    # workflow_dispatch 只补推镜像，不重新发版
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from version.go
        id: version
        run: |
          # 从 internal/version/version.go 读取 Version 常量，失败则回退到 tag 名
          VER=$(grep -oE '"v[0-9]+\.[0-9]+\.[0-9][^"]*"' internal/version/version.go | tr -d '"' | head -n1 || true)
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME}"
            echo "version.go 解析失败，回退到 tag: $VER"
          fi
          if [ -z "$VER" ]; then
            echo "无法解析版本号" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # GHCR 镜像：多阶段构建（debian 12 + libvips），仅 linux/amd64
  # 镜像 tag 与 git tag 对齐：v0.2.3 / 0.2.3 / 0.2 / latest
  # ============================================================
  docker:
    name: docker-ghcr
    needs: [release]
    # 推 tag 时要求 release 成功；workflow_dispatch 时 release 被跳过，仅跑本 job
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 默认分支或指定 tag：保证 Dockerfile / scripts 与被构建的版本一致
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VER="${INPUT_TAG}"
          if [ -n "$VER" ]; then
            echo "using workflow_dispatch input: $VER"
          else
            # 从 internal/version/version.go 读取 Version 常量，失败则回退到 tag 名
            VER=$(grep -oE '"v[0-9]+\.[0-9]+\.[0-9][^"]*"' internal/version/version.go | tr -d '"' | head -n1 || true)
          fi
          if [ -z "$VER" ]; then
            VER="${GITHUB_REF_NAME}"
            echo "version.go 解析失败，回退到 tag: $VER"
          fi
          case "$VER" in
            v*) ;;
            *) echo "invalid version (must start with v): $VER" >&2; exit 1 ;;
          esac
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ztag-docker
          cache-to: type=gha,mode=max,scope=ztag-docker
          provenance: false
