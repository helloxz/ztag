# ============================================================
# ZTAG 服务默认配置模板
# ------------------------------------------------------------
# 首次启动时，若 data/config.toml 不存在，本文件会被自动拷贝到
# data/config.toml 作为运行时配置（便于 docker 挂载 data 目录）。
# 之后请修改 data/config.toml，本模板不再参与加载。
# ============================================================

[server]
addr = ":18080"          # HTTP 监听地址
mode = "release"          # gin 运行模式：debug | release
workers = 4               # 并发工作者数（同时进行的重内存分析任务数），未配置默认 4，最小 1；按单请求峰值约 90MB 估算，4 并发约 360MB 峰值

[log]
level = "warn"          # 日志级别：debug | info | warn | error

[auth]
enabled = false         # 是否开启对外 API 鉴权（建议生产开启）
api_keys = []           # 允许访问的 API Key 列表，enabled=true 时生效

[ai]
timeout = 60                  # 单次 AI 调用超时（秒）
image_timeout = 30            # 图片下载超时（秒），单次 Probe/Fetch 各自预算；缺省/非法回退 30s
max_retries = 2               # 单渠道内失败重试次数
mock = false                  # 是否启用模拟 AI（本地联调用）；仅支持改配置文件，管理台不展示
max_image_bytes = 10485760    # 图片大小上限（字节），默认 10MB
allow_private_urls = false    # 是否放行内网/保留地址图片（SSRF 防护，生产保持 false）；仅支持改配置文件，管理台不展示
temperature = 0               # 采样温度（0~2）；0 = 不发送该参数，走模型默认。GPT-5 系列等推理模型在思考模式下不接受该参数，传了会 400；
                              # 接 Qwen/DeepSeek 等非推理模型时可改成 0.1~0.2 让输出更稳定；仅支持改配置文件，管理台不展示
top_p = 0                     # 核采样（0~1）；0 = 不发送该参数，走模型默认；与 temperature 建议二选一；仅支持改配置文件，管理台不展示
disabled_thinking_keywords = [  # 命中任一关键词（不区分大小写）时请求显式关闭思考模式；可在管理台「图像分析 → 模型行为」编辑
  "qwen",                      # Qwen3 系列（含 -Thinking 后缀变体）
  "mimo",                      # MiMo 系列（默认开启思考）
  "deepseek",                  # DeepSeek 系列（思考模型）
]                               # 缺失或置空时回退内置默认列表（同上），确保行为稳定

# ---------------- 主备双渠道配置 ----------------
# 固定支持两个渠道 id（唯一标识）：
#   default : 默认渠道（必填），普通请求走这里；
#   backup  : 备用渠道（可选，默认不启用），default 失败时切换兜底；
#             需要时把下面「备用渠道」整段取消注释并填好 base_url / api_key / models。
# 每个渠道可配置多个模型（models 为模型标识字符串数组），模型必须支持图片输入（多模态）。
# type 支持三种协议：
#   openai-chat     : OpenAI Chat Completions 兼容接口
#   openai-response : OpenAI Responses 兼容接口
#   anthropic       : Anthropic Messages 兼容接口（含阿里云等兼容网关）
[[ai.channels]]
id = "default"
type = "openai-chat"          # 协议类型
base_url = "https://api.openai.com/v1"
api_key = "replace-with-your-api-key"
models = [
  "gpt-5.6-luna",             # 轻量快速：默认走它，适合大批量打标
  "gpt-5.4-mini",             # 质量优先：请求时传 model=default/gpt-5.4-mini 指定
]

# 备用渠道（默认不启用）：取消下面整段注释即可开启，default 失败时自动切换兜底
# [[ai.channels]]
# id = "backup"                 # Anthropic 兼容备用渠道示例（阿里云）
# type = "anthropic"
# base_url = "https://dashscope.aliyuncs.com/api/v2/apps/anthropic"
# api_key = "replace-with-your-api-key"
# models = [
#   "claude-3-5-sonnet",
# ]

# ---------------- 内容审核（决策模型，支持多渠道） ----------------
# 接口：
#   POST /api/v1/image/decision   图片审核（image_url / image_base64）
#   POST /api/v1/text/decision    文本审核（text）
# 请求里可用 model 指定下面的渠道 id；不指定则按配置顺序轮询。
# 某个渠道失败时：还有其它渠道就换一个再试一次，只有一个渠道就重试一次。
#
# 注意：默认不启用（下面 [ai.decision] 的 enabled = false，渠道也默认关闭/注释）。
#   启用总开关前，请先至少启用一个渠道（把对应节的 enabled 改为 true），
#   否则配置校验会失败（ai.decision.channels must have at least one enabled channel）。
#
# type 支持三种协议：
#   gemini-decision    : Gemini Decision 1（Gemini 原生 Decisions API）
#   openai-decision    : OpenAI 兼容 Decisions API（如 Vercel AI Gateway 的 /v1/decisions）
#   systemone-decision : System One（Jev 系：state + questions 映射，如 OpenRouter /api/alpha/decisions）
#
# 输出（两个接口一致）：category + score(0~100) + model_id + elapsed_ms
#   图片分类：normal|porn|suggestive|gore|violence|politics|gambling|drugs|terror|other_risk
#   文本分类：normal|spam|ads|porn|politics|abuse|fraud|illegal|other_risk
#   两者互不混用；供应商安全拦截额外返回 blocked(99) / prohibited(100)
[ai.decision]
enabled = false          # 总开关：false 时两个决策接口都返回未配置
timeout = 30             # 单次调用超时（秒），<=0 回退 30s
max_text_chars = 4000    # 文本审核字符上限，超长直接报错

[[ai.decision.channels]]
id = "gemini-main"       # 渠道 id：调用时 channel 填这个值；小写字母/数字/下划线/中划线，需唯一
type = "gemini-decision" # 协议类型
enabled = false          # 单渠道开关：默认关闭，需要时改成 true（总开关也要开）
base_url = "https://generativelanguage.googleapis.com" # 实际请求 {base_url}/v1beta/decisions
api_key = "replace-with-your-gemini-api-key"           # 请求头 x-goog-api-key；多个用 | 分隔，调用时随机选一个
model = "gemini-decision-1"                            # 上游模型标识
resolution = "high"                                    # 图片分辨率：low | medium | high | ultra_high

# 备用决策渠道示例（默认注释）：需要多渠道轮询/兜底时取消下面整段注释
# [[ai.decision.channels]]
# id = "openai-main"
# type = "openai-decision"
# enabled = true
# base_url = "https://ai-gateway.vercel.sh/v1"         # 实际请求 {base_url}/decisions
# api_key = "replace-with-your-ai-gateway-key"         # 请求头 Authorization: Bearer；多个用 | 分隔，调用时随机选一个
# model = "openai/gpt-6-luna-decisions"
# resolution = "high"                                  # 映射为 OpenAI 的 detail：low→low / medium→auto / high→high / ultra_high→original

# System One（Jev 系）渠道示例（默认注释）：OpenRouter 的 decisions 端点用 state + questions 映射
# [[ai.decision.channels]]
# id = "openrouter-main"
# type = "systemone-decision"
# enabled = true
# base_url = "https://openrouter.ai/api/alpha"         # 实际请求 {base_url}/decisions
# api_key = "replace-with-your-openrouter-key"         # 请求头 Authorization: Bearer；多个用 | 分隔
# model = "microsoft/microsoft-decision-1.1"           # 注意 OpenRouter 的模型 id 带双重前缀
# resolution = "high"                                  # systemone 协议忽略该字段
# 注意：该模型只收 PNG/JPEG 且每边 280~1568；默认 webp 模式下该渠道会在发送前自行
#       转为 JPEG ≤1568，convert_webp=false 时则所有渠道统一规整为 JPEG ≤1568

# ---------------- Web 管理台（/admin） ----------------
# 访问 http://<addr>/admin 可在线管理配置、渠道与 API 密钥。
# 首次访问会引导初始化账号，初始化后由管理台自动写回本段；
# password_hash 为 bcrypt 哈希（不可逆），请勿手工填写明文密码。
[admin]
enabled = true       # 是否启用 Web 管理台：false 时 /admin 页面、接口与静态资源全部 404（增强安全，适合生产）
                     # 仅支持改配置文件，需重启生效；关闭后如需再改配置，请手工编辑本文件后重启
username = ""        # 管理员用户名，留空表示未初始化
password_hash = ""   # 密码哈希（bcrypt），留空表示未初始化
